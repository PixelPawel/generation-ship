services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env            # ADMIN_TOKEN=... (comment reports); not in git
        required: false
    volumes:
      - ./data:/data          # votes.db lives here — back this folder up
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # HTTPS certificates
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
