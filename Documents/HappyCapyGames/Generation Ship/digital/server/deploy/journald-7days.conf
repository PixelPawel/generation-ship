# Copy to /etc/systemd/journald.conf.d/ on the VPS, then: systemctl restart systemd-journald
# The privacy policy promises that server logs (which can hold IP addresses) are gone after 7 days.
# The api and caddy containers log here (docker-compose.yml: logging driver journald).
[Journal]
MaxRetentionSec=7day
MaxFileSec=1day
